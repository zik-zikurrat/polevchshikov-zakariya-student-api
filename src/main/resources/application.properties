spring.application.name=polevchshikov-zakariya-student-api

# Personalized application URL: http://localhost:8082/polevchshikov-zakariya/api/students
server.port=8080
server.servlet.context-path=/polevchshikov-zakariya
server.error.include-message=always

# Database connection. Real values come from environment variables
# (SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD) set in docker-compose.yml from the .env file.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/polevchshikov_zakariya_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:polevchshikov}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

student.name=Polevchshikov Zakariya
student.group=IT2-2312
student.id=37052
